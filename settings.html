<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F6F0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script src="js/theme.js"></script>
<title>Settings · Hurley</title>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="back" href="./">&larr; Home</a>
  <h1>Settings</h1>
</div></header>
<main class="wrap">
  <section class="card"><b>Appearance</b>
    <div class="seg" id="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  </section>
  <section class="card"><b>Text size</b>
    <div class="seg" id="size"><button data-v="normal">Normal</button><button data-v="large">Large</button></div>
  </section>
  <section class="card"><b>Notifications</b><p class="note">Coming soon.</p></section>
  <section class="card">
    <div class="row"><span>Version</span><b id="ver"></b></div>
    <div class="btns"><button class="btn ghost" id="upd">Check for updates</button><a class="btn ghost" href="install.html">How to install</a></div>
  </section>
</main>
<script src="js/data.js"></script>
<script>
const root = document.documentElement;
const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const put = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function seg(id, key, cur, apply) {
  const box = document.getElementById(id);
  const mark = v => box.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  mark(cur);
  box.onclick = e => { const v = e.target.dataset.v; if (!v) return; put(key, v); apply(v); mark(v); };
}
seg('theme', 'hurley.theme', get('hurley.theme') || 'auto', v => { if (v === 'auto') delete root.dataset.theme; else root.dataset.theme = v; });
seg('size', 'hurley.size', get('hurley.size') || 'normal', v => { if (v === 'large') root.dataset.size = 'large'; else delete root.dataset.size; });
document.getElementById('ver').textContent = 'v' + VERSION;
document.getElementById('upd').onclick = async () => {
  try { const r = await navigator.serviceWorker.getRegistration(); if (r) await r.update(); } catch (e) {}
  location.reload();
};
</script>
</body>
</html>
