<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F6F0">
<title>Hurley · It Takes a Village</title>
<link rel="icon" href="/assets/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
<style>
:root{--cream:#F9F6F0;--plaque:#F4EDE0;--ink:#2C3531;--muted:#5E6762;--sage:#4A7C59;--terra-ink:#B4502C;--font:"Outfit",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--cream:#1E2421;--plaque:#F4EDE0;--ink:#F1ECE2;--muted:#AEB7B1;--sage:#7FB28E;--terra-ink:#F0956F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55}
main{max-width:480px;margin:0 auto;padding:40px 16px;display:flex;flex-direction:column;gap:20px;text-align:center}
.plaque{background:var(--plaque);border-radius:18px;padding:16px}
.plaque img{width:100%;height:auto;display:block}
h1{margin:0;font-size:32px;color:var(--sage)}
p{margin:0;color:var(--muted)}
a{color:var(--terra-ink);font-weight:600}
small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <div class="plaque"><img src="assets/collective-logo.webp" alt="It Takes a Village"></div>
  <h1>Hurley</h1>
  <p>Hurley's own village app is on its way.</p>
  <p><a href="/">Back to It Takes a Village</a></p>
  <small>v0.0.1</small>
</main>
</body>
</html>
